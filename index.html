    <script>
    (function() {
        var APP_VERSION = 'eb759ad9';
        var CACHE_DB = 'calibrate_bundle_cache';
        var CACHE_STORE = 'compiled';

        // â”€â”€â”€ IndexedDB helpers (Fase 4.3: cachÃ© de bundle compilado) â”€â”€â”€
        function openDB() {
            return new Promise(function(resolve, reject) {
                var req = indexedDB.open(CACHE_DB, 1);
                req.onupgradeneeded = function(e) {
                    e.target.result.createObjectStore(CACHE_STORE);
                };
                req.onsuccess = function(e) { resolve(e.target.result); };
                req.onerror = function(e) { reject(e); };
            });
        }

        function getCompiledFromCache(version) {
            return openDB().then(function(db) {
                return new Promise(function(resolve) {
                    var tx = db.transaction(CACHE_STORE, 'readonly');
                    var req = tx.objectStore(CACHE_STORE).get(version);
                    req.onsuccess = function() { resolve(req.result || null); };
                    req.onerror = function() { resolve(null); };
                });
            }).catch(function() { return null; });
        }

        function saveCompiledToCache(version, compiled) {
            return openDB().then(function(db) {
                return new Promise(function(resolve) {
                    var tx = db.transaction(CACHE_STORE, 'readwrite');
                    var store = tx.objectStore(CACHE_STORE);
                    // Limpiar versiones antiguas
                    store.clear();
                    store.put(compiled, version);
                    tx.oncomplete = function() { resolve(true); };
                    tx.onerror = function() { resolve(false); };
                });
            }).catch(function() { return false; });
        }

        function checkDeps() {
            return typeof React !== 'undefined' 
                && typeof ReactDOM !== 'undefined' 
                && typeof Babel !== 'undefined'
                && typeof RECETAS_DB !== 'undefined'
                && typeof escalarReceta !== 'undefined';
        }

        function runCompiledCode(compiled) {
            var script = document.createElement('script');
            script.textContent = compiled;
            document.body.appendChild(script);
        }

        function compileAndRun() {
            var t0 = performance.now();
            // 1) Intentar usar cachÃ© compilado
            getCompiledFromCache(APP_VERSION).then(function(cached) {
                if (cached) {
                    console.log('[Bundle Cache] HIT v=' + APP_VERSION + ' Â· ' + Math.round(performance.now() - t0) + 'ms');
                    runCompiledCode(cached);
                    return;
                }
                console.log('[Bundle Cache] MISS v=' + APP_VERSION + ' Â· compilando...');
                // 2) Fetch + compile + cache
                fetch('js/app-bundle.js?v=' + APP_VERSION)
                    .then(function(res) { 
                        if (!res.ok) throw new Error('Failed to fetch app-bundle.js: ' + res.status);
                        return res.text(); 
                    })
                    .then(function(jsxCode) {
                        try {
                            var tCompile = performance.now();
                            var compiled = Babel.transform(jsxCode, { 
                                presets: ['react'],
                                filename: 'app-bundle.js'
                            }).code;
                            console.log('[Bundle Cache] Compilado en ' + Math.round(performance.now() - tCompile) + 'ms');
                            // Guardar en IndexedDB (async, no bloqueante)
                            saveCompiledToCache(APP_VERSION, compiled).then(function(ok) {
                                console.log('[Bundle Cache] Guardado: ' + (ok ? 'OK' : 'FAIL'));
                            });
                            runCompiledCode(compiled);
                        } catch(e) {
                            console.error('Babel compilation error:', e);
                            showError('Error al compilar la aplicaciÃ³n: ' + e.message);
                        }
                    })
                    .catch(function(e) {
                        console.error('Failed to load app:', e);
                        // Auto-recovery: si el bundle da 404, el SW estÃ¡ sirviendo basura.
                        // Desregistrarlo y recargar una vez.
                        if (String(e.message).indexOf('404') !== -1 && !sessionStorage.getItem('sw_cleanup_done')) {
                            sessionStorage.setItem('sw_cleanup_done', '1');
                            console.warn('[Auto-recovery] 404 detectado, limpiando SW y cachÃ©s...');
                            Promise.all([
                                navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function(rs) { return Promise.all(rs.map(function(r) { return r.unregister(); })); }) : Promise.resolve(),
                                'caches' in window ? caches.keys().then(function(ks) { return Promise.all(ks.map(function(k) { return caches.delete(k); })); }) : Promise.resolve(),
                                new Promise(function(resolve) { try { indexedDB.deleteDatabase('nutriplan_bundle_cache'); } catch(e){} resolve(); })
                            ]).finally(function() {
                                setTimeout(function() { window.location.reload(true); }, 300);
                            });
                            return;
                        }
                        showError('Error al cargar la aplicaciÃ³n: ' + e.message + ' (recarga la pÃ¡gina)');
                    });
            });
        }

        function showError(msg) {
            var loader = document.getElementById('app-loader');
            if (loader) {
                loader.innerHTML = '<div style="text-align:center;padding:20px;">'
                    + '<p style="color:#ef4444;font-weight:600;margin-bottom:8px;">âš ï¸ ' + msg + '</p>'
                    + '<p style="font-size:14px;">Intenta recargar la pÃ¡gina</p>'
                    + '<button onclick="location.reload(true)" style="margin-top:12px;padding:8px 24px;background:#22c55e;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:500;">Recargar</button>'
                    + '</div>';
            }
        }

        var attempts = 0;
        var maxAttempts = 150;
        var interval = setInterval(function() {
            attempts++;
            if (checkDeps()) {
                clearInterval(interval);
                compileAndRun();
            } else if (attempts >= maxAttempts) {
                clearInterval(interval);
                if (typeof Babel !== 'undefined') {
                    compileAndRun();
                } else {
                    showError('Las dependencias no se cargaron correctamente');
                }
            }
        }, 100);
    })();
    </script>

    <!-- Fase 5.2: registro de Service Worker para PWA offline -->
    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js?v=' + APP_VERSION)
                .then(function(reg) {
                    console.log('[PWA] Service Worker registrado:', reg.scope);
                    // Forzar chequeo de actualizaciÃ³n en cada carga
                    reg.update();
                    // Auto-activar SW nuevo y recargar una sola vez
                    var refreshing = false;
                    navigator.serviceWorker.addEventListener('controllerchange', function() {
                        if (refreshing) return;
                        refreshing = true;
                        console.log('[PWA] SW nuevo activo, recargando...');
                        window.location.reload();
                    });
                    reg.addEventListener('updatefound', function() {
                        var nw = reg.installing;
                        if (!nw) return;
                        nw.addEventListener('statechange', function() {
                            if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('[PWA] Nueva version lista, activando...');
                                nw.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });

                    // Fix iOS PWA: visibilitychange fuerza reg.update() al volver al foreground
                    // (el evento 'load' no re-dispara en iOS cuando se abre la app desde home screen)
                    document.addEventListener('visibilitychange', function() {
                        if (document.visibilityState === 'visible') {
                            reg.update();
                        }
                    });
                })
                .catch(function(err) {
                    console.warn('[PWA] Registro fallo:', err);
                });

            // Version check via version.json (bypass completo del SW cache)
            // Verifica al cargar y cada vez que la app vuelve al foreground
            var _lastVersionCheck = 0;
            function checkVersionJson() {
                var now = Date.now();
                if (now - _lastVersionCheck < 30000) return; // max 1 vez cada 30s
                _lastVersionCheck = now;
                fetch('./version.json?_=' + now, { cache: 'no-store' })
                    .then(function(r) { return r.json(); })
                    .then(function(d) {
                        if (d && d.v && d.v !== APP_VERSION) {
                            console.log('[PWA] Nueva version detectada via version.json:', d.v);
                            navigator.serviceWorker.getRegistration().then(function(reg) {
                                if (reg) {
                                    reg.update().then(function() {
                                        if (reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                                    });
                                }
                            });
                        }
                    })
                    .catch(function() {});
            }
            checkVersionJson();
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') checkVersionJson();
            });
        });
    }
    </script>

    <!-- Fase PTR: Pull-to-Refresh â†’ fuerza chequeo de Service Worker -->
    <script>
    (function() {
      if (!('ontouchstart' in window) || !('serviceWorker' in navigator)) return;

      /* â”€â”€ Indicador visual (burbuja Ã¡mbar) â”€â”€ */
      var ind = document.createElement('div');
      ind.style.cssText = [
        'position:fixed', 'top:0', 'left:50%', 'z-index:99999',
        'pointer-events:none', 'width:44px', 'height:44px',
        'border-radius:50%', 'background:#C8943A',
        'display:flex', 'align-items:center', 'justify-content:center',
        'box-shadow:0 6px 20px rgba(200,148,58,0.45)',
        'opacity:0', 'transform:translateX(-50%) translateY(-60px)',
        'will-change:transform,opacity'
      ].join(';');
      document.body.appendChild(ind);

      function setIcon(type) {
        if (type === 'spin') {
          ind.innerHTML = '<div style="width:20px;height:20px;border:2.5px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite;"></div>';
        } else {
          ind.innerHTML = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><polyline points="2,8 6,12 14,4" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        }
      }
      setIcon('spin');

      var startY = 0, delta = 0, active = false, locked = false;
      var THRESHOLD = 72;

      function applyMove(d) {
        var ty = -60 + d * 0.55;
        var op = Math.min(1, d / THRESHOLD);
        var sc = 0.55 + op * 0.45;
        ind.style.transition = 'none';
        ind.style.transform = 'translateX(-50%) translateY(' + ty + 'px) scale(' + sc + ')';
        ind.style.opacity = op;
      }

      function snapIn() {
        ind.style.transition = 'transform 0.3s cubic-bezier(0.34,1.56,0.64,1),opacity 0.15s ease';
        ind.style.transform = 'translateX(-50%) translateY(14px) scale(1)';
        ind.style.opacity = '1';
      }

      function snapOut() {
        ind.style.transition = 'transform 0.28s ease,opacity 0.28s ease';
        ind.style.transform = 'translateX(-50%) translateY(-60px) scale(0.7)';
        ind.style.opacity = '0';
        locked = false;
      }

      function doRefresh() {
        locked = true;
        setIcon('spin');
        snapIn();
        navigator.serviceWorker.getRegistration().then(function(reg) {
          if (!reg) { setTimeout(function() { snapOut(); setTimeout(function() { setIcon('spin'); }, 350); }, 900); return; }
          reg.update().then(function() {
            if (reg.waiting) {
              /* SW nuevo listo â†’ activarlo (controllerchange recarga la pÃ¡gina) */
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              /* No ocultamos el indicador â€” la recarga lo elimina */
            } else {
              /* Sin actualizaciÃ³n disponible â†’ checkmark 1s */
              setIcon('check');
              setTimeout(function() {
                snapOut();
                setTimeout(function() { setIcon('spin'); }, 350);
              }, 1100);
            }
          }).catch(function() {
            setTimeout(function() { snapOut(); setTimeout(function() { setIcon('spin'); }, 350); }, 700);
          });
        }).catch(function() {
          setTimeout(function() { snapOut(); setTimeout(function() { setIcon('spin'); }, 350); }, 700);
        });
      }

      document.addEventListener('touchstart', function(e) {
        if (locked || window.scrollY > 4 || e.touches.length !== 1) return;
        startY = e.touches[0].clientY;
        delta = 0;
        active = true;
      }, { passive: true });

      document.addEventListener('touchmove', function(e) {
        if (!active || locked) return;
        var d = e.touches[0].clientY - startY;
        if (d <= 0) { active = false; return; }
        delta = d;
        applyMove(d);
      }, { passive: true });

      document.addEventListener('touchend', function() {
        if (!active) return;
        active = false;
        if (delta >= THRESHOLD) { doRefresh(); } else { snapOut(); }
        delta = 0;
      }, { passive: true });

      document.addEventListener('touchcancel', function() {
        active = false; delta = 0;
        if (!locked) snapOut();
      }, { passive: true });
    })();
    </script>
